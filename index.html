<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세피리아 랜덤런 룰렛</title>
    <link rel="icon" href="images/outfit-17.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-nav-container">
        <div class="header-section">
            <img src="images/logo.png" alt="Random Run Controller" class="top-logo">
            <h1 class="main-title">세피리아 랜덤런 룰렛</h1>
            <p class="creator-credit">
                제작자: <a href="https://github.com/chicken-triceps" target="_blank">chicken-triceps</a>
            </p>
        </div>

        <div class="settings-panel">
            <details class="custom-dropdown">
                <summary>표시 설정</summary>
                <div class="dropdown-content">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="show-weapon" checked onchange="updateFieldVisibility()"> 무기
                    </label>
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="show-outfit" checked onchange="updateFieldVisibility()"> 의상
                    </label>
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="show-miracle" checked onchange="updateFieldVisibility()"> 기적
                    </label>
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="show-combo" checked onchange="updateFieldVisibility()"> 콤보
                    </label>
                </div>
            </details>

            <div class="vertical-divider"></div>

            <details class="custom-dropdown">
                <summary>'자유' 포함</summary>
                <div class="dropdown-content">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="chk-weapon-free" checked> 무기
                    </label>
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="chk-outfit-free" checked> 의상
                    </label>
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="chk-miracle-free" checked> 기적
                    </label>
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="chk-combo-free" checked> 콤보
                    </label>
                </div>
            </details>

            <div class="vertical-divider"></div>

            <div class="setting-group">
                <span class="settings-label">콤보 개수</span>
                <input type="number" id="global-combo-count" class="global-combo-input" value="2" min="1" max="5">
                <span style="color: var(--text-sub);">개</span>
            </div>

            <div class="vertical-divider"></div>

            <button class="btn-settings-add" onclick="addPlayer()">+ 플레이어 추가</button>
        </div>
    </div>

    <div class="main-container">
        <div id="playersArea" class="players-area">
        </div>
    </div>

    <div class="hardmode-card">
        <div class="hardmode-label">뿌리거둠</div>
        <div id="hardmodeValue" class="hardmode-value">0</div>
        <button class="btn-roll-small" onclick="rollHardMode()">Roll</button>
    </div>

    <div class="bottom-btn-group">
        <button class="btn-bottom-action btn-clear-all" onclick="clearAll()">Clear All</button>
        <button class="btn-bottom-action btn-roll-all" onclick="rollAll()">Roll All</button>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
